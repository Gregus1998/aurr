[package]
name = "aurr-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
azure_core = "0.29.1"
azure_storage = "0.21.0"
azure_storage_blobs = "0.21.0"
crossterm = "0.29.0"
futures = "0.3.31"
ratatui = "0.24"
tokio = { version = "1.0", features = ["full"] }
clipboard = "0.5"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.5.0"
json = "0.12.4"
serde_json = "1.0.145"
azure_identity = { version = "0.30.0", features = ["default"]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter"] }
chrono = "0.4"
once_cell = "1.20"
config = "0.15.19"
uuid = "1.19.0"
async-recursion = "1.1.1"
colored = "3.1.1"
